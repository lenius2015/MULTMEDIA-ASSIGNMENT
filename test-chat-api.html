<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Chat API Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }

        // Test 1: Check if API endpoint exists and returns JSON
        async function testConversationsAPI() {
            addResult('Testing conversations API endpoint...', 'info');
            
            try {
                const response = await fetch('/admin/api/chat/conversations');
                
                if (!response.ok) {
                    addResult(`API returned status: ${response.status} ${response.statusText}`, 'error');
                    return;
                }

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    addResult(`Expected JSON response, got: ${contentType}`, 'error');
                    return;
                }

                const data = await response.json();
                addResult('✓ API returned valid JSON', 'success');
                addResult(`✓ Response structure: ${JSON.stringify(data).substring(0, 200)}...`, 'success');
                
            } catch (error) {
                addResult(`✗ API test failed: ${error.message}`, 'error');
            }
        }

        // Test 2: Check if we get proper error when not authenticated
        async function testAuthRequired() {
            addResult('Testing authentication requirement...', 'info');
            
            try {
                const response = await fetch('/admin/api/chat/conversations');
                
                if (response.status === 401 || response.status === 302) {
                    addResult('✓ Authentication required (expected)', 'success');
                } else if (response.ok) {
                    const data = await response.json();
                    if (data.success === false && data.message) {
                        addResult('✓ Proper error message returned', 'success');
                    } else {
                        addResult('✓ API accessible (might be authenticated)', 'info');
                    }
                } else {
                    addResult(`✗ Unexpected status: ${response.status}`, 'error');
                }
                
            } catch (error) {
                addResult(`✗ Auth test failed: ${error.message}`, 'error');
            }
        }

        // Run tests
        testConversationsAPI();
        testAuthRequired();
    </script>
</body>
</html>
